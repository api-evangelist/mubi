aid: mubi
name: MUBI
description: 'MUBI is a London-headquartered global streaming service, film distributor
  and production company founded in 2007 by Efe Cakarel (originally as The Auteurs,
  rebranded MUBI in 2010). It operates a curated subscription video-on-demand service
  for arthouse, independent, documentary and world cinema across more than 190 countries,
  alongside MUBI GO (weekly cinema tickets), the Notebook film-criticism publication
  and print magazine, MUBI Editions, a merchandise shop, and theatrical distribution
  and sales arms including The Match Factory and Cineart. MUBI publishes no public
  developer program, API documentation, or machine-readable specification; the
  api.mubi.com host serves its own first-party web, mobile and TV clients only.'
